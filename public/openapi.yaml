openapi: 3.1.0
info:
  title: Spain Postal Codes API
  version: 1.0.0
  summary: Spanish postal codes, towns and provinces.
  license:
    name: MIT
    identifier: MIT
  contact:
    url: https://github.com/codecruz/spain-postal-codes
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /api/locations:
    get:
      summary: List locations
      description: Paginated list of locations sorted by postal code, optionally filtered by province and town name.
      operationId: listLocations
      parameters:
        - name: provincia
          in: query
          description: Province code (`28`) or name (`Madrid`, `alava`, `València`…). Case- and accent-insensitive.
          schema: { type: string }
          example: sevilla
        - name: q
          in: query
          description: Case-insensitive substring of the town name (min. 2 characters).
          schema: { type: string, minLength: 2 }
          example: dos hermanas
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: A page of locations.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Location' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/locations/{codPostal}:
    get:
      summary: Find towns by postal code
      operationId: getLocationsByPostalCode
      parameters:
        - name: codPostal
          in: path
          required: true
          description: 5-digit postal code. A 4-digit code is padded with a leading zero (`1450` → `01450`).
          schema: { type: string, pattern: '^\d{4,5}$' }
          example: '28001'
      responses:
        '200':
          description: Towns served by the postal code.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/provinces:
    get:
      summary: List provinces
      description: The 52 Spanish provinces (including Ceuta and Melilla) with dataset statistics.
      operationId: listProvinces
      responses:
        '200':
          description: All provinces, sorted by code.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Province' }
components:
  schemas:
    Location:
      type: object
      required: [provincia, poblacion, cod_postal]
      properties:
        provincia: { type: string, example: Madrid }
        poblacion: { type: string, example: Madrid }
        cod_postal: { type: string, pattern: '^\d{5}$', example: '28001' }
    Province:
      type: object
      required: [code, name, locations, postal_codes]
      properties:
        code: { type: string, pattern: '^\d{2}$', example: '28' }
        name: { type: string, example: Madrid }
        locations: { type: integer, example: 328 }
        postal_codes: { type: integer, example: 287 }
    PaginationMeta:
      type: object
      required: [page, limit, total, pages]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 50 }
        total: { type: integer, example: 13979 }
        pages: { type: integer, example: 280 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, message]
          properties:
            status: { type: integer }
            message: { type: string }
  responses:
    BadRequest:
      description: Invalid parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { status: 400, message: 'Invalid postal code "abc": it must have 5 digits.' } }
    NotFound:
      description: No data for the given postal code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { status: 404, message: No locations found for postal code 99999. } }
