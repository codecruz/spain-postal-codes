name: TEMP regenerate composer.lock

on:
  push:
    branches: [ine-dataset-static-api]
    paths: ['.github/workflows/tmp-composer-lock.yml', 'composer.json']

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, mbstring, pdo_sqlite
          coverage: none
      - run: composer update --no-interaction --no-progress 2>&1 | tee update.log
      - run: |
          set +e
          {
            echo "== lint:container"; php bin/console lint:container
            echo "== lint:yaml"; php bin/console lint:yaml config public/openapi.yaml --parse-tags
            echo "== schema:validate"; php bin/console doctrine:schema:validate --skip-sync
            echo "== db:setup"; composer db:setup
            echo "== phpunit"; vendor/bin/phpunit
          } > checks.log 2>&1
          echo "exit=$?" >> checks.log
          git status --porcelain > changed.txt
          true
      - uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: |
            composer.lock
            symfony.lock
            update.log
            checks.log
            changed.txt
