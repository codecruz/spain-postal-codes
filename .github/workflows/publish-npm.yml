name: Publish npm package

# Publish by creating a GitHub release whose tag is "npm-v<version>",
# matching "version" in packages/npm/package.json.
#
# Uses npm Trusted Publishing (OIDC): no npm token is stored in the repository.
# On npmjs.com, the package must list this repository and this workflow file
# (publish-npm.yml) as its trusted publisher.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing (also signs provenance)

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'npm-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Use an npm version with Trusted Publishing support (>= 11.5.1)
        run: npm install --global npm@^11.5.1 && npm --version

      - name: Check tag matches package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${{ github.event.release.tag_name }}" = "npm-v${version}" || { echo "Tag does not match version ${version}"; exit 1; }

      - run: npm test
      - run: npm publish --access public
