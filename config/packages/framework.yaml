# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true

    # Stateless JSON API: no sessions, no cookies.
    session: false

    # 4xx responses are client errors, not application errors: keep them out of the error log.
    exceptions:
        Symfony\Component\HttpKernel\Exception\HttpException:
            log_level: info

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
